<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Skylines Photo Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>City Skylines Gallery</h1>
    <p>
      This gallery features skylines from ten cities around the world.
      Each photograph highlights the unique architecture, lighting, and
      atmosphere that make every skyline different from the next.
    </p>
  </header>

  <section class="gallery">

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city1/600/400" alt="Skyline of a coastal city at sunset with tall glass towers">
      <figcaption>1</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city2/600/400" alt="Downtown skyline reflected in a river at night">
      <figcaption>2</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city3/600/400" alt="Historic city center with a mix of old and modern buildings">
      <figcaption>3</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city4/600/400" alt="Skyscrapers viewed from a rooftop terrace during the day">
      <figcaption>4</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city5/600/400" alt="Bridge and skyline illuminated at dusk">
      <figcaption>5</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city6/600/400" alt="Aerial view of a dense downtown business district">
      <figcaption>6</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city7/600/400" alt="City skyline framed by a park in the foreground">
      <figcaption>7</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city8/600/400" alt="Modern skyline with a mountain range in the background">
      <figcaption>8</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city9/600/400" alt="Harbor view with skyscrapers along the waterfront">
      <figcaption>9</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/seed/city10/600/400" alt="Panoramic skyline shot taken from a nearby hill at night">
      <figcaption>10</figcaption>
    </figure>

  </section>

</body>
</html>
